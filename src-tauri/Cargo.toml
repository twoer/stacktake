[package]
name = "Stacktake"
version = "1.0.1"
description = "本机资产清点台账"
authors = ["twoer"]
license = "MIT"
edition = "2024"

[lib]
name = "stacktake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 扫描层
ignore = "0.4"      # ripgrep 出品的并行目录遍历，自带 .gitignore 语义
rayon = "1"         # 数据并行
trash = "5"         # 跨平台移入废纸篓，绝不硬删
dirs = "5"          # 用户目录（home / config）
sys-locale = "0.3"  # 系统界面语言（localectl / Win32 / AppleLanguages 一层封装）

# 更新下载（update.rs）。必须 Rust 侧：下载域名会 302 到
# objects.githubusercontent.com，不在 webview CSP 的 connect-src 白名单里，
# 前端 fetch 会被静默拦掉。reqwest tauri 内部已带，这里是直接用。
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util"] } # 流式写盘（tauri 的 async runtime 就是 tokio）
tauri-plugin-dialog = "2"
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
